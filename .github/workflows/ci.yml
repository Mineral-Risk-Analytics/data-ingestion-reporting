# Engine CI (2026-11-23) — the PR merge gate.
#
# Runs the full pytest suite (SQLite in-memory — no database service, no
# secrets needed; the GTA key and R2 credentials are never used by tests)
# on every PR and every push to main. Make this a REQUIRED status check in
# GitHub → Settings → Branches → branch protection for main, so a red
# suite blocks merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run suite
        run: pytest tests/ -q --tb=short
