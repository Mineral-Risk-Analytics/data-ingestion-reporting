services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bdi
      POSTGRES_PASSWORD: bdi
      POSTGRES_DB: battery_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdi -d battery_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
