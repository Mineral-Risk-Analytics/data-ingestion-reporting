[project]
name = "battery-data-intelligence-engine"
version = "0.1.0"
description = "Backend ingestion foundation for battery supply chain intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "polars>=1.15.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "typer>=0.15.0",
    "openai>=1.54.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pyjwt[crypto]>=2.9.0",
    "cachetools>=5.5.0",
    "inngest>=0.5.18"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
bdi-ingest = "app.cli:main"

[tool.hatch.envs.default.scripts]
ingest-usgs = "bdi-ingest ingest-usgs ./data/mineral_commodities/MCS2025_World_Data.csv"
ingest-usgs-force = "bdi-ingest ingest-usgs ./data/mineral_commodities/MCS2025_World_Data.csv --force"
ingest-worldbank = "bdi-ingest ingest-worldbank"
ingest-worldbank-full = "bdi-ingest ingest-worldbank --since-year 1960"
ingest-opensanctions = "bdi-ingest ingest-opensanctions"
ingest-comtrade = "bdi-ingest ingest-comtrade"
ingest-comtrade-recent = "bdi-ingest ingest-comtrade --years 2021,2022,2023"
ingest-comtrade-cn-only = "bdi-ingest ingest-comtrade --reporters CN --years 2021,2022,2023"
ingest-gleif = "bdi-ingest ingest-gleif"
ingest-sec = "bdi-ingest ingest-sec-edgar"
ingest-federal-register = "bdi-ingest ingest-federal-register"
ingest-eurlex = "bdi-ingest ingest-eurlex"
ingest-eurlex-no-fetch = "bdi-ingest ingest-eurlex --no-fetch"
ingest-gta = "bdi-ingest ingest-gta"
ingest-gta-recent = "bdi-ingest ingest-gta --since-year 2020"
igest-mrds = "bdi-ingest ingest-mrds --local-file data/facilities/mrds.csv"
seed-companies = "bdi-ingest seed-companies"
seed-facilities = "bdi-ingest seed-facilities"
seed-supply-relationships = "bdi-ingest seed-supply-relationships"
seed-regulations = "bdi-ingest seed-regulations"
seed-hs-mappings = "bdi-ingest seed-hs-mappings"
seed-materials = "bdi-ingest seed-materials"
seed-hs-mappings-force = "bdi-ingest seed-hs-mappings --force"
build-trade-signals = "bdi-ingest build-trade-signals"
rescore-chemistry = "bdi-ingest rescore-chemistry"
rescore-chemistry-lfp = "bdi-ingest rescore-chemistry --slug lfp"
rescore-chemistry-nmc = "bdi-ingest rescore-chemistry --slug nmc"
rescore-market = "bdi-ingest rescore-market"
rescore-all = "bdi-ingest rescore-all"
show-scores = "bdi-ingest show-scores"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
